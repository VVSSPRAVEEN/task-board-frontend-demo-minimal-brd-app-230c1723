name: generated-product-ci
on:
  push:
    branches: [main, "p3/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: generated-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Semgrep SAST
        run: |
          python -m pip install --upgrade pip "semgrep==1.79.0"
          semgrep --config p/default --config p/dockerfile --metrics off --error .
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          version: "v0.75.0"
      - name: Gitleaks secret scan
        run: |
          curl -sfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-git --redact --exit-code 1

  release-artifact:
    needs: [security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-source
          path: .
          include-hidden-files: true

  deploy:
    needs: [release-artifact]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger the configured deployment provider
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$COOLIFY_DEPLOY_WEBHOOK" ]; then
            curl -fsS -X POST "$COOLIFY_DEPLOY_WEBHOOK"
            exit 0
          fi
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsS "$RENDER_DEPLOY_HOOK"
            exit 0
          fi
          echo "No deployment hook configured. Local Coolify deployment remains the active path."
